# Un solo origen para todo: el SPA y la API. Antes el frontend vivía en :5173 y
# el backend en :8000, lo que obligaba a hornear la URL del backend en el bundle
# (rompía al abrir la app por IP desde el móvil) y hacía imposible servir la app
# por https, porque una página segura no puede llamar a un backend http.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Registro con el tiempo de cada petición. Cloudflare corta a los 100 segundos
# con un error 524, y generar una lección con imagen puede acercarse: sin este
# dato no hay forma de saber cuánto margen queda realmente.
log_format con_tiempo '$remote_addr "$request" $status ${body_bytes_sent}B '
                      'en ${request_time}s (upstream ${upstream_response_time}s) '
                      '"$http_user_agent" "$http_cf_connecting_ip"';

server {
  listen 80;
  listen 443 ssl;
  access_log /var/log/nginx/access.log con_tiempo;
  server_name _;

  ssl_certificate     /etc/nginx/certs/chispa.crt;
  ssl_certificate_key /etc/nginx/certs/chispa.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;

  # Las lecciones con imagen pueden tardar: el proveedor de IA genera texto e
  # imagen antes de responder. Con el timeout por defecto de 60s nginx cortaba
  # la petición y el niño veía un error aunque el backend siguiera trabajando.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  # Las ilustraciones pesan entre 1,5 y 3 MB y no cambian nunca: el nombre del
  # fichero es el id de la lección. Se cachean un año en el navegador, así que
  # volver a una conversación pasada ya no las vuelve a traer por el túnel.
  #
  # Sin `proxy_buffering off`, nginx no tiene búfer suficiente para una
  # respuesta de ese tamaño y la escribe en un fichero temporal antes de
  # enviarla, con la latencia y las escrituras a disco que eso supone.
  location /api/media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # La barra final de proxy_pass es la que quita el prefijo: /api/auth/login
  # llega al backend como /auth/login. Sin ella, el backend recibiría /api/... y
  # devolvería 404 en todo.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Los ficheros de assets llevan un hash en el nombre: si el contenido cambia,
  # cambia el nombre. Por eso pueden cachearse para siempre sin riesgo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html NO se cachea nunca. Es el único fichero con nombre fijo, y es
  # quien dice qué bundle cargar. Sin esto, el navegador (y el borde de
  # Cloudflare) se quedan con una copia vieja y la app sigue sirviendo la
  # versión anterior después de cada despliegue: exactamente lo que pasó el
  # 21-09, con un formulario de alta sin el campo de código de invitación.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri /index.html;
  }
}
