services:
  postgres:
    image: postgres:16-alpine
    # Vuelve solo tras un reinicio o un corte de luz. Sin esto, la politica es
    # `no`: Docker arranca al iniciar la maquina pero los contenedores se quedan
    # parados. En la demo publica eso deja el tunel en pie anunciando un origen
    # que no responde, asi que el visitante ve un error del CDN en lugar de la
    # web: parece que funciona y no funciona.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chispa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-chispa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chispa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chispa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chispa}
      JWT_SECRET: ${JWT_SECRET}
      AI_CONFIG_KEY: ${AI_CONFIG_KEY}
      ENVIRONMENT: production
      # Con el frontend sirviendo la API bajo /api, el navegador ya no hace
      # peticiones entre orígenes y CORS deja de intervenir. Se conserva para
      # quien ataque el backend directamente por el puerto 8000 (depuración,
      # `npm run dev` sin proxy).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Acceso de la demo pública: sin INVITE_CODE el registro queda abierto, y
      # sin CLIENT_IP_HEADER el límite de intentos no se cree ninguna cabecera.
      INVITE_CODE: ${INVITE_CODE:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Solo local: el frontend alcanza al backend por la red interna de Docker.
      # Publicarlo en la LAN permitiría falsificar la cabecera de IP del cliente
      # y esquivar el límite de intentos por IP.
      - "127.0.0.1:8000:8000"
    volumes:
      # Las imágenes generadas viven en MEDIA_DIR y la BD guarda su ruta. Sin
      # este volumen el directorio muere con el contenedor: cada reconstrucción
      # dejaba en la base de datos rutas apuntando a ficheros borrados, y el
      # niño volvía a su isla y encontraba la ilustración rota.
      - media:/app/media

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # Vacío = mismo origen: el cliente pide /api y nginx lo enruta al backend.
        # Solo se define para apuntar a un backend ajeno; ponerle un host aquí
        # vuelve a atar el bundle a una máquina y rompe el acceso por https.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:80"
      - "5443:443"
    volumes:
      # Certificado de la CA local para servir https en la red de casa. El micrófono
      # (Web Speech API) solo funciona en contexto seguro, y http por IP no lo es.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Solo accesible desde la propia máquina (no expuesto a la red). El backend
    # lo alcanza por la red interna de Docker en http://ollama:11434.
    ports:
      - "127.0.0.1:11434:11434"
    # GPU (descomenta si tienes nvidia-container-toolkit instalado):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
  media:
